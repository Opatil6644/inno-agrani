# If you want to override default config(yes/no) like tensor_parallel size, trust_remote_code and model commit id
# Create a csv file with below columns,
# (*) model(name of the model)
# (*) tensor_parallel(expected values numericals)
# (*) trust_remote_code(expected values-> 0 as False, 1 as True) 
# (*) huggingface model commit id
# And add the filepath to custom_config_path flage below.

# Below is an example of how custome config csv file should look like,
# | model       | tensor_parallel | trust_remote_code | model_commit_id |
# |-------------|-----------------| ------------------| ------------------|
# | meta-llama  |       1         |          0        |   abdf3322323     |

# Details will be read from the default file if custom_config_path does not contain model details

path:
  - custom_config_path:

datasets:
  mode: default        # options: default | custom

  custom:
    available:
      - BBH
      - IFEVAL
      - MATH
      - GPQA
      - MMLU
      - MUSR

    selected:
      # - BBH
      # - IFEVAL
      # - MATH
      # - GPQA
      # - MMLU
      # - MUSR

    evaluation:
      num_prompts: 200        # number of prompts to run
      output_length: 128      # max tokens / output length

models:
