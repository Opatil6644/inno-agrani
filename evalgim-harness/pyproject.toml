[project]
name = "evaluation_library"
readme = "README.md"
authors = [{name = "Fundamental AI Research - Meta"}]
requires-python = ">=3.10"
version = "0.0.1"

dependencies = [
   "torch==2.8.0",
   "einops==0.8.1",
   "diffusers==0.35.2",
   "datasets==4.4.1",
   "accelerate==1.12.0",
   "timm==1.0.22",
   "transformers==4.57.2",
   "torchmetrics==1.8.2",
   "torcheval==0.0.7",
   "yacs==0.1.8",
   "submitit==1.5.3",
   "protobuf==3.20.2",
   "numpy==1.26.4",
   "joblib==1.4.2",
   "pyyaml==6.0.2",
   "webdataset==1.0.2",
   "torchdiffeq==0.2.5",
   "kaleido==1.2.0",
   "plotly==5.24.1",
   "paretoset==1.2.5",
   "seaborn==0.13.2",
   "submitit==1.5.3",
   "torch-fidelity==0.3.0",
   "ipykernel==6.29.5",
   "sentencepiece==0.2.1",
   "openpyxl==3.1.5",
   "scikit-learn==1.7.2"
]


[tool.setuptools]
py-modules = ["evaluation_library"]
[tool.setuptools.packages.find]
include = ["evaluation_library"]
exclude = ["projects", "tests", "logs"]

[project.optional-dependencies]
    dev = [
        # Format
        "ruff==0.3.4",
        "pre-commit==3.6.1",
        # Linters
        "mypy==1.14.1",
        "pylint==3.3.5",
    ]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    
]